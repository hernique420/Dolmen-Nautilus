<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Mesa do Cartógrafo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&family=IM+Fell+English+SC&display=swap">
<style>
/* Layout: a drafting table. Tools down the left, the sheet in the middle, notes and map details on the right. */
:root{
  --bg:#dfe3da; --panel:#f3f4ef; --sheet:#c9cfc3; --ink:#1d2a2c; --muted:#5a6863; --line:#c3cabd;
  --accent:#8c5f17; --accent-soft:#f0e3c8; --sel:#2a68b0; --danger:#a3321f; --chip:#e8ebe3;
  --f-display:"IM Fell English SC", "Iowan Old Style", Georgia, serif;
  --f-ui:"Alegreya Sans", "Segoe UI", system-ui, sans-serif;
  --f-num:"IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111716; --panel:#182120; --sheet:#0c1110; --ink:#e3e9e4; --muted:#93a29c; --line:#2a3633;
  --accent:#d6a650; --accent-soft:#3a2f1c; --sel:#6aa7ee; --danger:#e07a63; --chip:#212b29; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111716; --panel:#182120; --sheet:#0c1110; --ink:#e3e9e4; --muted:#93a29c; --line:#2a3633;
  --accent:#d6a650; --accent-soft:#3a2f1c; --sel:#6aa7ee; --danger:#e07a63; --chip:#212b29; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.4 var(--f-ui)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--sel);outline-offset:2px}
.app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr);gap:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;box-sizing:border-box}
/* header */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;min-width:0}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand svg{width:30px;height:30px;color:var(--accent);flex:none}
.brand h1{font:400 1.35rem/1 var(--f-display);margin:0;letter-spacing:.02em;white-space:nowrap}
.mtitle{font:400 1.05rem var(--f-display);color:var(--muted);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:32ch}
.levels{display:flex;gap:4px;align-items:center;flex-wrap:wrap;min-width:0}
.ltab{border:1px solid var(--line);background:var(--chip);border-radius:6px;padding:3px 10px;cursor:pointer;font-size:.9rem;white-space:nowrap}
.ltab[aria-pressed="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.spacer{flex:1}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:5px 11px;cursor:pointer;font-size:.92rem;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn svg{width:16px;height:16px}
.btn[disabled]{opacity:.45;cursor:default}
.btn.armed{background:var(--danger);border-color:var(--danger);color:#fff}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;background:var(--panel)}
.seg button{border:0;background:none;padding:4px 10px;cursor:pointer;font-size:.88rem;white-space:nowrap}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--panel)}
.iconbtn{display:inline-grid;place-items:center;width:34px;height:34px;border:1px solid var(--line);background:var(--panel);border-radius:7px;cursor:pointer;padding:0}
.iconbtn svg{width:18px;height:18px}
.iconbtn[disabled]{opacity:.4;cursor:default}
/* work area */
.work{display:grid;grid-template-columns:auto minmax(0,1fr) 300px;gap:10px;min-height:0}
.tools{display:flex;flex-direction:column;gap:3px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px;overflow-y:auto;min-height:0}
.tools .grp{font:500 .62rem var(--f-ui);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);text-align:center;margin:6px 0 1px}
.tools .grp:first-child{margin-top:0}
.tool{display:grid;place-items:center;width:40px;height:38px;border:1px solid transparent;border-radius:7px;background:none;cursor:pointer;color:var(--ink);padding:0;position:relative}
.tool svg{width:21px;height:21px}
.tool:hover{background:var(--chip)}
.tool[aria-pressed="true"]{background:var(--ink);color:var(--panel)}
.tool kbd{position:absolute;right:2px;bottom:1px;font:500 .55rem var(--f-num);opacity:.55}
.stage{position:relative;min-width:0;min-height:0;border-radius:10px;overflow:hidden;background:var(--sheet);border:1px solid var(--line)}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
.opts{position:absolute;left:10px;top:10px;right:10px;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;pointer-events:none}
.opts>*{pointer-events:auto}
.optbox{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;background:color-mix(in srgb,var(--panel) 94%,transparent);border:1px solid var(--line);border-radius:9px;padding:6px 9px;box-shadow:0 2px 10px rgba(0,0,0,.12);max-width:100%}
.optbox .lbl{font:500 .66rem var(--f-ui);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.optbox input[type=range]{width:110px;accent-color:var(--accent)}
.optbox .hint{font-size:.88rem;color:var(--muted)}
.stamps{display:flex;flex-wrap:wrap;gap:3px}
.stamps button{width:32px;height:32px;display:grid;place-items:center;border:1px solid var(--line);border-radius:6px;background:#fff;cursor:pointer;padding:0}
.stamps button[aria-pressed="true"]{outline:2px solid var(--accent);outline-offset:1px}
.stamps canvas{width:26px;height:26px}
.swatch{width:22px;height:22px;border-radius:50%;border:2px solid var(--panel);box-shadow:0 0 0 1px var(--line);cursor:pointer;padding:0}
.swatch[aria-pressed="true"]{box-shadow:0 0 0 2px var(--ink)}
.status{position:absolute;left:10px;bottom:10px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;font:500 .8rem var(--f-num);background:color-mix(in srgb,var(--panel) 92%,transparent);border:1px solid var(--line);border-radius:7px;padding:4px 9px;max-width:calc(100% - 140px);pointer-events:none}
.status b{font-weight:500;color:var(--accent)}
.zoom{position:absolute;right:10px;bottom:10px;display:flex;gap:4px}
/* panel */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;min-height:0;display:flex;flex-direction:column;min-width:0}
.ptabs{display:flex;border-bottom:1px solid var(--line)}
.ptabs button{flex:1;border:0;background:none;padding:9px 6px;cursor:pointer;font-weight:500;color:var(--muted);border-bottom:2px solid transparent}
.ptabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.pbody{padding:12px;overflow:auto;display:flex;flex-direction:column;gap:12px;min-height:0}
.eyebrow{font:500 .66rem var(--f-ui);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0}
.fld{display:flex;flex-direction:column;gap:4px;font-size:.88rem}
.fld input,.fld select,.fld textarea{border:1px solid var(--line);border-radius:7px;padding:6px 8px;background:var(--bg);min-width:0}
.fld textarea{min-height:120px;resize:vertical;font:400 .9rem/1.45 var(--f-num)}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.note{border:1px solid var(--line);border-radius:9px;padding:9px 10px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px;cursor:pointer;background:var(--bg)}
.note[aria-current="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.pnum{display:inline-grid;place-items:center;min-width:24px;height:24px;border-radius:50%;background:var(--danger);color:#fff;font:700 .8rem var(--f-num);padding:0 4px}
.md{font-size:.92rem;min-width:0;overflow-wrap:anywhere}
.md>:first-child{margin-top:0}.md>:last-child{margin-bottom:0}
.md h3,.md h4{font:400 1.05rem var(--f-display);margin:.2em 0}
.md ul,.md ol{padding-left:1.2em;margin:.3em 0}
.md p{margin:.3em 0}
.md code{font:.85em var(--f-num);background:var(--chip);padding:0 3px;border-radius:3px}
.banner{border:1px dashed var(--accent);background:var(--accent-soft);border-radius:9px;padding:9px 10px;font-size:.9rem}
.help{position:absolute;right:10px;top:56px;width:min(340px,calc(100% - 20px));max-height:calc(100% - 110px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;box-shadow:0 10px 30px rgba(0,0,0,.25);font-size:.9rem;z-index:5}
.help table{border-collapse:collapse;width:100%}
.help td{padding:3px 4px;border-bottom:1px solid var(--line);vertical-align:top}
.help kbd{font:500 .78rem var(--f-num);background:var(--chip);border:1px solid var(--line);border-radius:4px;padding:0 4px;white-space:nowrap}
.dlg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:grid;place-items:center;z-index:20;padding:16px}
.dlg>div{background:var(--panel);border-radius:12px;padding:16px;max-width:min(720px,100%);max-height:90vh;overflow:auto;display:flex;flex-direction:column;gap:10px}
.dlg img{max-width:100%;border:1px solid var(--line)}
.dlg textarea{width:100%;min-height:160px;font:.8rem var(--f-num);box-sizing:border-box}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:8px 14px;border-radius:8px;font-size:.92rem;z-index:30;box-shadow:0 6px 20px rgba(0,0,0,.25)}
@media (max-width:860px){
  html,body{height:auto}
  .app{height:auto;min-height:100%}
  .work{grid-template-columns:minmax(0,1fr);grid-template-rows:auto 62vh auto}
  .tools{flex-direction:row;overflow-x:auto;overflow-y:hidden;padding:4px}
  .tools .grp{writing-mode:vertical-rl;transform:rotate(180deg);margin:0 2px}
  .tool{flex:none}
  .mtitle{display:none}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="app">
  <header class="top">
    <div class="brand"><svg aria-hidden="true"><use href="#i-logo"/></svg><h1>Mesa do Cartógrafo</h1></div>
    <span class="mtitle" id="mtitle"></span>
    <nav class="levels" id="levels" aria-label="Níveis"></nav>
    <span class="spacer"></span>
    <div class="row">
      <button class="iconbtn" id="bUndo" title="Desfazer (Ctrl+Z)" aria-label="Desfazer"><svg><use href="#i-undo"/></svg></button>
      <button class="iconbtn" id="bRedo" title="Refazer (Ctrl+Shift+Z)" aria-label="Refazer"><svg><use href="#i-redo"/></svg></button>
    </div>
    <div class="seg" role="group" aria-label="Estilo do mapa"><button data-theme-map="azul">Azul clássico</button><button data-theme-map="pergaminho">Pergaminho</button></div>
    <div class="row">
      <button class="btn" id="bOpen" title="Abrir um arquivo de mapa (.json)"><svg><use href="#i-open"/></svg>Abrir</button>
      <button class="btn" id="bSave" title="Salvar o arquivo do mapa para o próximo cartógrafo"><svg><use href="#i-save"/></svg>Salvar mapa</button>
      <button class="btn primary" id="bPng" title="Exportar uma imagem deste nível para o Discord"><svg><use href="#i-image"/></svg>Exportar imagem</button>
      <button class="iconbtn" id="bHelp" title="Atalhos e dicas" aria-label="Atalhos e dicas" aria-expanded="false"><svg><use href="#i-help"/></svg></button>
    </div>
    <input type="file" id="fileIn" accept=".json,application/json" hidden>
  </header>

  <div class="work">
    <nav class="tools" id="tools" aria-label="Ferramentas"></nav>
    <main class="stage" id="stage">
      <canvas id="cv" aria-label="Mapa do calabouço"></canvas>
      <div class="opts" id="opts"></div>
      <div class="status" id="status" aria-live="polite"></div>
      <div class="zoom">
        <button class="iconbtn" id="zOut" aria-label="Afastar"><svg><use href="#i-minus"/></svg></button>
        <button class="iconbtn" id="zIn" aria-label="Aproximar"><svg><use href="#i-plus"/></svg></button>
        <button class="iconbtn" id="zFit" aria-label="Enquadrar o mapa" title="Enquadrar o mapa"><svg><use href="#i-fit"/></svg></button>

    <aside class="panel" aria-label="Detalhes">
      <div class="ptabs" role="tablist">
        <button role="tab" id="tabSel" aria-selected="true">Seleção</button>
        <button role="tab" id="tabNotes" aria-selected="false">Notas</button>
        <button role="tab" id="tabMap" aria-selected="false">Mapa</button>
      </div>
      <div class="pbody" id="pbody"></div>
    </aside>
  </div>
</div>

<script>
(() => {
"use strict";
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const uid = () => Math.random().toString(36).slice(2, 9);

/* ================= units: the drawing works in tenths of a square; each map says how big a square is ================= */
const SQ = 10, H = 2.5, GW = 480, GH = 480, NC = GW * GH;
const SCALES = [[1.5, 5], [3, 10]]; // metres and feet per square
const mSq = () => (map && map.scale) || 1.5, ftSq = () => (SCALES.find(x => x[0] === mSq()) || [0, Math.round(mSq() / .3)])[1];
const num = v => { const r1 = Math.round(v * 10) / 10, r2 = Math.round(v * 100) / 100, x = Math.abs(r2 - r1) < 1e-9 || Math.round(r2 * 100) % 5 ? r1 : r2; return x.toLocaleString("pt-BR"); };
const numFt = v => (Math.round(v * 2) / 2).toLocaleString("pt-BR");
const toM = u => u / SQ * mSq(), toFt = u => u / SQ * ftSq(), mToU = m => m / mSq() * SQ;
const fmtLen = u => `${num(toM(u))} m (${numFt(toFt(u))}′)`;
const fmtSize = (w, h) => `${num(toM(w))} × ${num(toM(h))} m (${numFt(toFt(w))}′ × ${numFt(toFt(h))}′)`;
